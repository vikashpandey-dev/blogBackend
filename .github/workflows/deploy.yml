
name: Deploy Blog API to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies on GitHub Runner
      - name: Install Dependencies
        run: npm ci

      # 4. Build TypeScript
      - name: Build TypeScript
        run: npm run build

      # 5. Configure SSH
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 6. Create deployment directory on EC2
      - name: Create Deployment Directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "mkdir -p /var/www/blogBackend/dist"

      # 7. Upload compiled TypeScript files
      - name: Upload Build Files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "$EC2_USER@$EC2_HOST:/var/www/blogBackend/dist/"

      # 8. Upload package files
      - name: Upload Package Files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            package.json package-lock.json \
            "$EC2_USER@$EC2_HOST:/var/www/blogBackend/"

      # 9. Install production dependencies and restart app
      - name: Install and Restart Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /var/www/blogBackend

            npm ci --omit=dev

            if pm2 describe blogBackend >/dev/null 2>&1; then
              pm2 restart blogBackend --update-env
            else
              pm2 start npm --name blogBackend -- start
            fi

            pm2 save
          EOF

      # 10. Deployment success
      - name: Deployment Complete
        run: echo "Blog API deployed successfully!"
